# Netlify hosting. publish.py copies only the public site into _site/ (no build tools, notes or test pages)
# and writes _site/_headers with each page's Content-Security-Policy.
[build]
  command = "python3 publish.py"
  publish = "_site"

# Security headers for every file
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Always fetch the latest content after an edit in /gk
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "no-cache"

# Keep the dashboard out of search engines
[[headers]]
  for = "/gk/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Pictures can be cached by browsers for a week (Netlify already serves HTTPS and compressed files)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The Projects list stays at /projects.html; the folder /projects/ holds the case studies
[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

# Case studies moved into /projects/: old links keep working
[[redirects]]
  from = "/case.html"
  to = "/projects/case.html"
  status = 301

