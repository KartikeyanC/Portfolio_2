# Netlify hosting: the site is plain static files, so there is no build step.
[build]
  publish = "."

# Always fetch the latest content after an edit in /gk
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "no-cache"

# Keep the dashboard out of search engines
[[headers]]
  for = "/gk/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
